workflow:
  rules:
    - if: '$CI_PIPELINE_SOURCE == "web"'
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
    - if: '$CI_COMMIT_BRANCH && $CI_OPEN_MERGE_REQUESTS'
      when: never
    - if: '$CI_COMMIT_BRANCH'

stages:
  - build
  - test
#  - compliance


#TODO: enable when clang format file has been added
.formatting:
  stage: compliance
  needs: []
  image: ubuntu:24.04
  before_script:
    - export DEBIAN_FRONTEND=noninteractive
    - apt-get update
    - apt-get install -y --no-install-recommends git clang-format
  script:
    - git clang-format --verbose --diff ${CI_MERGE_REQUEST_DIFF_BASE_SHA}

.artifacts-template:
  artifacts:
    reports:
      junit: build/tests/check.xunit.xml

.debian-based:
  extends: .artifacts-template
  parallel:
    matrix:
       - MPI: [ mpich, openmpi ]
         USE_CLANG: ["0", "1"]
  needs: []
  variables:
    CMAKE_BUILD_TYPE: Debug
    OMPI_ALLOW_RUN_AS_ROOT: "1"
    OMPI_ALLOW_RUN_AS_ROOT_CONFIRM: "1"
    OMPI_MCA_mpi_yield_when_idle: "1"
    OMPI_MCA_rmaps_base_oversubscribe: "1"
    FF_SCRIPT_SECTIONS: "1"
  before_script:
    - export DEBIAN_FRONTEND=noninteractive
    - apt-get update
    - >-
      apt-get install -y --no-install-recommends
      gcc
      g++
      gfortran 
      cmake 
      make
      libopenmpi-dev
      libmpich-dev
      git
      python3
      python3-venv
      libxml2-dev
      libomp-dev
      llvm-14-tools
  script:
    - |
      if [[ "${USE_CLANG}" == "1" ]]; then
        apt-get install -y --no-install-recommends clang
        export MPICH_CC=clang MPICH_CXX=clang++
        export OMPI_CC=clang OMPI_CXX=clang++
      else
        export MPICH_CC=gcc MPICH_CXX=g++
        export OMPI_CC=gcc OMPI_CXX=g++
      fi
    - export PATH=$PATH:/usr/lib/llvm-14/bin
    - export FI_PROVIDER=shm MPIR_CVAR_POLLS_BEFORE_YIELD=1
    - export OMPI_MCA_btl=vader,self OMPI_MCA_mpi_yield_when_idle=1
    - >-
      cmake -S ./ -B build -DCMAKE_C_COMPILER=mpicc.${MPI} \
                           -DCMAKE_CXX_COMPILER=mpicxx.${MPI} \
                           -DCMAKE_Fortran_COMPILER=mpif90.${MPI} \
                           -DMPIEXEC_EXECUTABLE=${MPIEXEC} \
                           -DCPT_TEST_LB=.8 \
                           -DCPT_TEST_UB=1.05 \
                           -DCPT_TEST_WORK=300000
    - cmake --build build --verbose
    - cmake --install build
    - EXIT_CODE=0
    - cmake --build build --verbose -- check || EXIT_CODE=$?
# This branch is not setup for stdc++-less build
#    - ldd build/libCPT.so | grep -q "libstdc++" && echo -e "\e[1;31mFound libstdc++ dependency, failure\e[0m" && exit 1
    - exit $EXIT_CODE

ubuntu:
  stage: test
  image: ubuntu:24.04
  extends: .debian-based
  variables:
    MPIEXEC: mpiexec.openmpi # TODO: Change to ${MPI} when Ubuntu's mpich hydra launcher is fixed
    LDFLAGS: "-flto=auto"

debian:
  stage: test
  image: debian:12
  extends: .debian-based
  variables:
    MPIEXEC: mpiexec.${MPI} # TODO: Change to ${MPI} when Debian's mpich hydra launcher is fixed

.cluster-template:
    extends: .artifacts-template
    tags: 
      - "downscope-testing"
    variables:
      SLURM_PARAM_CPUS_PER_TASK: "-c 4"
      SLURM_PARAM_ACCOUNT: "-A rwth1282"
      SLURM_PARAM_PARTITION: "-p c23ms"
      SLURM_DPARAM_ACCOUNT: "-A rwth1282"
      SLURM_DPARAM_PARTITION: "-p c23ms"
      CI_MODE: "Srun"
    before_script:
      - module purge
      - module load "${TOOLCHAIN}/${VERSION}"
      - module load Python
      - |
        if [[ "${TOOLCHAIN}" == "iimpi" && "${VERSION}" == "2023b" ]]; then
          module load CMake/3.27.6
        else
          module load CMake
        fi
      - >-
        if [[ "${COMPILER}" == *"Clang"* ]]; then
          module load Clang
          export CC=clang CXX=clang++
          export OMPI_CC=clang OMPI_CXX=clang++ OMPI_FC=gfortran
          export MPICH_CC=clang MPICH_CXX=clang++ MPICH_FC=ifort
          if [[ "${TOOLCHAIN}" == *"iimpi"* ]]; then
            export FC=ifort F90=ifort
          fi
        fi
      - >-
        if [[ "${USE_ONEAPI}" == "1" ]]; then
          export CC=icx CXX=icpx FC=ifx F90=ifx
          export I_MPI_CC=icx I_MPI_CXX=icpx I_MPI_FC=ifx  I_MPI_F90=ifx
        fi
      - >-
        if [[ -n "$EBVERSIONIIMPI" ]] && [[ "$EBVERSIONIIMPI" < "2024a" ]]; then
          export ADD_CMAKE_OPTIONS="-DLLVM_FILECHECK_PATH=/home/pj416018/sw/UTIL/FileCheck/bin/FileCheck"
        fi
      - export I_MPI_FABRICS=shm I_MPI_WAIT_MODE=1
      - export OMPI_MCA_btl=vader,self OMPI_MCA_mpi_yield_when_idle=1
    parallel:
      matrix:
        - TOOLCHAIN: ["iimpi"]
          VERSION: ["2022a", "2022b", "2023a", "2023b"]
          COMPILER: [""]
          USE_ONEAPI: ["0", "1"]
        - TOOLCHAIN: ["iimpi"]
          VERSION: ["2024a"] # These versions do not include the legacy compilers
          COMPILER: [""]
          USE_ONEAPI: ["1"]
        - TOOLCHAIN: ["iimpi"]
          VERSION: ["2022a", "2023a", "2023b", "2024a"]
          COMPILER: ["Clang"]
        - TOOLCHAIN: ["gompi"]
          VERSION: ["2022a", "2023a", "2023b", "2024a"]
          COMPILER: ["Clang", ""]
        - TOOLCHAIN: ["iimpi", "gompi"]
          VERSION: ["2025a"]
          COMPILER: ["LLVM", ""]

.cluster-build:
    stage: build
    extends: .cluster-template
    script:
      - mkdir build
      - cmake -S ./ -B build -DCMAKE_INSTALL_PREFIX=$PWD/install -DCMAKE_BUILD_TYPE=RelWithDebInfo ${ADD_CMAKE_OPTIONS}
      - cmake --build build --parallel ${SLURM_CPUS_PER_TASK} -v
      - cmake --install build

cluster:
    stage: test
    extends: .cluster-template
    script:
      - !reference [.cluster-build, script]
      - EXIT_CODE=0
      - cmake --build build --verbose -- check || EXIT_CODE=$?
      - ldd build/libCPT.so
#      - ldd build/libCPT.so | grep -q 'libstdc++' && echo "Error libstdc++ linked" && exit 1 || echo "Info No libstdc++ dependency found"
      - exit $EXIT_CODE
    artifacts:
      reports:
        junit: build/tests/check.xunit.xml
