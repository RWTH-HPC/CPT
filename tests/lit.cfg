# -*- Python -*- vim: set ft=python ts=4 sw=4 expandtab tw=79:
# Configuration file for the 'lit' test runner.

import os
import importlib
import lit.formats
from lit.TestingConfig import TestingConfig

config: TestingConfig

# Tell pylint that we know config and lit_config exist somewhere.
if 'PYLINT_IMPORT' in os.environ:
    config = object()
    lit_config = object()


# name: The name of this test suite.
config.name = 'OTF-CPT'

# suffixes: A list of file extensions to treat as test files.
config.suffixes = ['.c', '.cpp', '.f90']

config.excludes = ["datastructures", "expected-metrics.c", "delay.c", "combined-metric.c", "mpi-only", "hybrid"]

# test_source_root: The root path where tests are located.
config.test_source_root = os.path.dirname(__file__)

# test_exec_root: The root object directory where output is placed
#config.test_exec_root = config.builddir + "/tests"

# test format
config.test_format = lit.formats.ShTest()

# Environment variables that should be inherited
environment_allowlist = [
    "INTEL_LICENSE_FILE",  # to run with icc INTEL_LICENSE_FILE must be set
    "PSM2_MULTI_EP",  # must be set to avoid PSM2 issues under oversubscription
    "HOSTNAME",  # the mpiexec-wrapper on claix-18 needs the HOSTNAME environment variable
    "FI_PROVIDER_PATH",
    "UCX_TLS",
    "HOME",
    "PYTHONPATH",
]
environment_allowprefixes = [
    "OMP_",
    "I_MPI_",
    "FI_",
    "MPIR_CVAR_",
    "OMPI_MCA_",
    "INTERNAL_",
] 
#if config.pass_prefixed_variables:
#    environment_allowprefixes += config.pass_prefixed_variables.split(";")

for envvar in os.environ:
    if config.forward_full_env:
        config.environment[envvar] = os.environ[envvar]
        continue
    if envvar in environment_allowlist:
        config.environment[envvar] = os.environ[envvar]
        continue
    for prefix in environment_allowprefixes:
        if envvar.startswith(prefix):
            config.environment[envvar] = os.environ[envvar]
            break

# pass all currently set environment variables that contain the word "MPI"
config.environment.update({k: v for k, v in os.environ.items() if "MPI" in k})

def has_module(module_name):
    try:
        import importlib.util
        return importlib.util.find_spec(module_name) is not None
    except AttributeError:
        try:
            __import__(module_name)
            return True
        except ImportError:
            return False

if has_module("matplotlib") and has_module("numpy"):
    config.available_features.add("plot-requirements")
else:
    lit_config.note("Disabling tests that require Python packages")

### Add feature-tested MPI features
#for k,v in config.lit_features.items():
#    if v:
#        config.available_features.add(k)
        
if (config.have_fortran):
    config.available_features.add("Fortran")
config.available_features.add(config.compiler_id)

for feature in config.test_compiler_features:
    config.available_features.add(feature)

for feature in config.test_mpi_features:
    config.available_features.add(feature)


# These must be added before the main %must-run substitution to have precedence over it. Otherwise the main one will
# replace the `%must-run` prefix.
config.substitutions.append(("%compile_c_delay", f"%clang %openmp_flags %flags %s {config.testsrcdir}/delay.c -lm -o %t"))
config.substitutions.append(("%compile_c", f"%clang %openmp_flags %flags %s -o %t"))
config.substitutions.append(("%compile_cxx", f"%clangXX %openmp_flags %flags %s -o %t"))
config.substitutions.append(("%compile_fc", f"%fc %openmp_flags %flags %s -o %t"))
config.substitutions.append(("%compile_mpi_c", f"%clang %s -o %t %mpi_c_flags %flags"))
config.substitutions.append(("%compile_mpi_cxx", f"%clangXX %s -o %t %mpi_cxx_flags %flags"))
config.substitutions.append(("%compile_mpi_fc", f"%fc %s -o %t %mpi_fortran_flags %flags"))
config.substitutions.append(("%compile_mpi_omp_c", f"%clang %s -o %t %openmp_flags %mpi_c_flags %flags"))
config.substitutions.append(("%compile_mpi_omp_cxx", f"%clangXX %s -o %t %openmp_flags %mpi_cxx_flags %flags"))
config.substitutions.append(("%compile_mpi_omp_fc", f"%fc %openmp_flags %flags %s -o %t"))
config.substitutions.append(("%openmp_flags", config.test_openmp_flags))
config.substitutions.append(("%mpi_c_flags", config.test_mpi_c_flags))
config.substitutions.append(("%mpi_cxx_flags", config.test_mpi_cxx_flags))
config.substitutions.append(("%mpi_fortran_flags", config.test_mpi_fortran_flags))
config.substitutions.append(("%clangXX", config.test_cxx_compiler))
config.substitutions.append(("%clang", config.test_c_compiler))
config.substitutions.append(("%fc", config.test_fc_compiler))
config.substitutions.append(("%flags", "-I%s -DLB_FAK=%s -DUB_FAK=%s -DWORK=%s" % (config.testsrcdir, config.test_lb, config.test_ub, config.test_work)))


config.substitutions.append(("%load_cpt_omp", f"env OMP_TOOL_LIBRARIES={config.cptomplib} "))
config.substitutions.append(("%load_cpt", f"env LD_PRELOAD={config.cptlib} OMP_TOOL_LIBRARIES={config.cptlib}"))
config.substitutions.append(("%cpt_options_stopped", "CPT_OPTIONS=\"stopped=1 barrier=1\" "))
config.substitutions.append(("%cpt_options_dump_stopped", "CPT_OPTIONS=\"verbose=1 stopped=1 barrier=1 stacktrace=1 metric_factor=1000\" "))
config.substitutions.append(("%mpirunnp", f"{config.mpiexec} {config.mpiexec_numproc_flag}"))
config.substitutions.append(("%plotscript", f"{config.project_src_dir}/script/CPT-plot.py"))
config.substitutions.append(("%project_src_dir", f"{config.project_src_dir}"))

config.substitutions.append(("%metricfile", f"{config.testsrcdir}/expected-metrics.h"))
config.substitutions.append(("%combinedmetric", f"{config.testsrcdir}/combined-metric.h"))
# Use tee to tap and save the MUST output passed to FileCheck. The file is
# written to the cmake build directory. It is placed in the directory
# corresponding to the source file as `<testsource_basename>.filecheck.in`.
filecheck_wiretap = "tee %basename_t.filecheck.in | "
filecheck_cmd = (filecheck_wiretap
                 + config.test_filecheck
                 + " --dump-input always"
                 + " --implicit-check-not 'Check failed'")

config.substitutions.append(
    ("%FileCheck",
     filecheck_cmd)
)
